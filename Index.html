<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09091b">
  <meta name="description" content="AURORA IA — Sua inteligência. Seu universo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AURORA IA">

  <title>AURORA IA</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09091b;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      color: white;
    }

    header {
      height: 76px;
      min-height: 76px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 13px;
      background: linear-gradient(110deg, #17103a, #101b42, #082b45);
      border-bottom: 1px solid #5542a9;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a855f7, #287bff, #00e5ff);
      box-shadow: 0 0 18px #713bdb88;
      font-size: 25px;
      font-weight: bold;
    }

    .brand h1 {
      font-size: 19px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #d9a7ff, #65dfff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .brand p {
      font-size: 10px;
      color: #b8b7db;
      margin-top: 4px;
    }

    #bp-embedded-webchat {
      width: 100%;
      height: calc(100% - 76px);
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      background: #101020;
    }

  </style>
</head>

<body>

  <header>
    <div class="logo">✦</div>
    <div class="brand">
      <h1>AURORA IA</h1>
      <p>Sua inteligência. Seu universo.</p>
    </div>
  </header>

  <div id="bp-embedded-webchat"></div>

  <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2026/11/14/11/20261114113901-YJ00PYXV.js" defer></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .catch(error => console.error('Erro no PWA:', error));
      });
    }
  </script>

</body>
</html>
